<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador IPCA+ CJS - Tesouro Direto</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a0a0a 50%, #0f0f0f 100%);
            color: #e0e0e0;
            overflow-x: hidden;
        }

        /* HEADER */
        header {
            background: linear-gradient(90deg, #000 0%, #1a0000 50%, #000 100%);
            border-bottom: 3px solid #ff0000;
            padding: 20px 0;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 0 30px rgba(255, 0, 0, 0.2);
        }

        header .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
            background: linear-gradient(90deg, #ff3333, #ff0000);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .nav-info {
            display: flex;
            gap: 30px;
            align-items: center;
            font-size: 12px;
            color: #888;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* ABAS DE INVESTIDORES */
        .investors-tabs {
            display: flex;
            gap: 10px;
            margin: 20px 0;
            flex-wrap: wrap;
            border-bottom: 2px solid rgba(255, 0, 0, 0.2);
            padding-bottom: 15px;
            overflow-x: auto;
        }

        .investor-tab {
            padding: 10px 16px;
            background: rgba(255, 0, 0, 0.05);
            border: 2px solid rgba(255, 0, 0, 0.2);
            color: #b0b0b0;
            cursor: pointer;
            border-radius: 6px;
            font-weight: 500;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
            font-size: 12px;
        }

        .investor-tab:hover {
            border-color: #ff0000;
            color: #ff3333;
        }

        .investor-tab.active {
            background: linear-gradient(90deg, rgba(255, 0, 0, 0.2), rgba(255, 0, 0, 0.1));
            border-color: #ff0000;
            color: #ff0000;
            box-shadow: 0 0 15px rgba(255, 0, 0, 0.2);
        }

        .btn-add-investor {
            padding: 8px 16px;
            background: linear-gradient(90deg, #ff3333, #ff0000);
            color: #000;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-left: auto;
            white-space: nowrap;
            font-size: 12px;
        }

        .btn-add-investor:hover {
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.5);
        }

        /* MODAL */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            animation: fadeIn 0.3s;
            overflow-y: auto;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal.show {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: linear-gradient(135deg, rgba(20, 20, 20, 0.95) 0%, rgba(30, 10, 10, 0.95) 100%);
            border: 2px solid #ff0000;
            border-radius: 12px;
            padding: 30px;
            max-width: 600px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 0 40px rgba(255, 0, 0, 0.3);
            margin: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 2px solid rgba(255, 0, 0, 0.2);
            padding-bottom: 15px;
        }

        .modal-header h2 {
            color: #ff0000;
            font-size: 18px;
        }

        .close-btn {
            background: none;
            border: none;
            color: #ff0000;
            font-size: 28px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .close-btn:hover {
            transform: rotate(90deg);
        }

        /* FORMS */
        .form-group {
            margin-bottom: 20px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        @media (max-width: 768px) {
            .form-row {
                grid-template-columns: 1fr;
            }
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 13px;
            font-weight: 500;
            color: #ff3333;
        }

        input, select, textarea {
            width: 100%;
            padding: 10px;
            background: rgba(0, 0, 0, 0.5);
            border: 2px solid rgba(255, 0, 0, 0.2);
            color: #e0e0e0;
            border-radius: 6px;
            font-size: 13px;
            transition: all 0.3s ease;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #ff0000;
            box-shadow: 0 0 15px rgba(255, 0, 0, 0.3);
        }

        input::placeholder {
            color: #666;
        }

        /* BOTÕES */
        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        button {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 13px;
        }

        .btn-primary {
            background: linear-gradient(90deg, #ff3333, #ff0000);
            color: #000;
            flex: 1;
        }

        .btn-primary:hover {
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.5);
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: rgba(255, 0, 0, 0.1);
            color: #ff3333;
            border: 2px solid #ff0000;
            flex: 1;
        }

        .btn-secondary:hover {
            background: rgba(255, 0, 0, 0.2);
        }

        .btn-delete {
            background: rgba(255, 0, 0, 0.2);
            color: #ff6666;
            border: 1px solid #ff6666;
            padding: 5px 10px;
            cursor: pointer;
            font-size: 11px;
        }

        .btn-delete:hover {
            background: rgba(255, 0, 0, 0.4);
        }

        .btn-edit {
            background: rgba(0, 100, 255, 0.2);
            color: #6bb6ff;
            border: 1px solid #6bb6ff;
            padding: 5px 10px;
            cursor: pointer;
            font-size: 11px;
        }

        .btn-edit:hover {
            background: rgba(0, 100, 255, 0.4);
        }

        .btn-small {
            padding: 6px 12px;
            font-size: 12px;
        }

        /* CARDS */
        .investor-card {
            background: linear-gradient(135deg, rgba(20, 20, 20, 0.8) 0%, rgba(30, 10, 10, 0.8) 100%);
            border: 2px solid rgba(255, 0, 0, 0.3);
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 30px;
            box-shadow: 0 8px 32px rgba(255, 0, 0, 0.1);
            display: none;
        }

        .investor-card.active {
            display: block;
            border-color: #ff0000;
            box-shadow: 0 0 30px rgba(255, 0, 0, 0.2);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid rgba(255, 0, 0, 0.2);
        }

        .investor-info {
            flex: 1;
        }

        .investor-name {
            font-size: 20px;
            font-weight: bold;
            color: #ff0000;
        }

        .investor-contact {
            font-size: 11px;
            color: #888;
            margin-top: 5px;
            line-height: 1.4;
        }

        .card-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        /* MENSAGENS */
        .message {
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 20px;
            display: none;
            font-size: 13px;
        }

        .message.success {
            display: block;
            background: rgba(0, 255, 0, 0.1);
            border: 1px solid #00ff00;
            color: #00ff00;
        }

        .message.error {
            display: block;
            background: rgba(255, 0, 0, 0.1);
            border: 1px solid #ff0000;
            color: #ff6666;
        }

        /* SECTION */
        .section {
            margin-bottom: 30px;
        }

        .section-title {
            font-size: 16px;
            font-weight: bold;
            color: #ff0000;
            margin-bottom: 15px;
            padding-left: 10px;
            border-left: 4px solid #ff0000;
        }

        /* TABS DE TÍTULOS */
        .securities-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .security-tab {
            padding: 8px 12px;
            background: rgba(255, 0, 0, 0.05);
            border: 2px solid rgba(255, 0, 0, 0.2);
            color: #b0b0b0;
            cursor: pointer;
            border-radius: 6px;
            font-weight: 500;
            transition: all 0.3s ease;
            font-size: 11px;
        }

        .security-tab:hover {
            border-color: #ff0000;
            color: #ff3333;
        }

        .security-tab.active {
            background: linear-gradient(90deg, rgba(255, 0, 0, 0.2), rgba(255, 0, 0, 0.1));
            border-color: #ff0000;
            color: #ff0000;
        }

        /* MÉTRICAS */
        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 12px;
            margin-bottom: 20px;
        }

        .metric-card {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 0, 0, 0.2);
            border-radius: 8px;
            padding: 12px;
            text-align: center;
        }

        .metric-label {
            font-size: 10px;
            color: #888;
            margin-bottom: 6px;
        }

        .metric-value {
            font-size: 16px;
            font-weight: bold;
            color: #ff0000;
        }

        /* TABELAS */
        .table-wrapper {
            overflow-x: auto;
            margin-top: 15px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
        }

        th {
            background: rgba(255, 0, 0, 0.15);
            color: #ff3333;
            padding: 8px;
            text-align: left;
            border-bottom: 2px solid rgba(255, 0, 0, 0.3);
            font-weight: 600;
        }

        td {
            padding: 8px;
            border-bottom: 1px solid rgba(255, 0, 0, 0.1);
            color: #d0d0d0;
        }

        tr:hover {
            background: rgba(255, 0, 0, 0.08);
        }

        .td-positive {
            color: #00ff00;
            font-weight: bold;
        }

        .td-negative {
            color: #ff6666;
        }

        /* API STATUS */
        .api-status {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 0, 0, 0.2);
            border-radius: 6px;
            padding: 8px 12px;
            margin-bottom: 20px;
            font-size: 11px;
        }

        .status-indicator {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 6px;
            animation: pulse 2s infinite;
        }

        .status-indicator.online {
            background: #00ff00;
        }

        .status-indicator.offline {
            background: #ff6666;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        /* RESPONSIVO */
        @media (max-width: 768px) {
            header .container {
                flex-direction: column;
                gap: 15px;
            }

            .nav-info {
                flex-direction: column;
                gap: 10px;
                width: 100%;
            }

            .card-header {
                flex-direction: column;
                align-items: flex-start;
            }

            .card-actions {
                width: 100%;
                margin-top: 15px;
            }

            .form-row {
                grid-template-columns: 1fr;
            }

            .investor-tab {
                font-size: 11px;
                padding: 8px 12px;
            }
        }

        /* FOOTER */
        footer {
            background: linear-gradient(90deg, #000 0%, #1a0000 50%, #000 100%);
            border-top: 3px solid #ff0000;
            padding: 30px 20px;
            text-align: center;
            color: #888;
            margin-top: 40px;
            font-size: 11px;
        }

        main {
            padding: 30px 0;
        }

        .no-data {
            text-align: center;
            color: #888;
            padding: 40px 20px;
            font-size: 13px;
        }

        .text-small {
            font-size: 11px;
            color: #888;
        }
    </style>
</head>
<body>
    <!-- HEADER -->
    <header>
        <div class="container">
            <div class="logo">💰 SIMULADOR IPCA+ CJS</div>
            <div class="nav-info">
                <div id="api-status" class="api-status">
                    <span class="status-indicator offline" id="status-dot"></span>
                    <span id="status-text">Conectando à API...</span>
                </div>
            </div>
        </div>
    </header>

    <!-- MAIN -->
    <main>
        <div class="container">
            <!-- ABAS DE INVESTIDORES -->
            <div class="investors-tabs" id="investorsTabsContainer">
                <button class="btn-add-investor" onclick="abrirModalNovoInvestidor()">➕ Novo</button>
            </div>

            <!-- MENSAGEM GLOBAL -->
            <div class="message" id="globalMessage"></div>

            <!-- CARDS DE INVESTIDORES -->
            <div id="investorsContainer"></div>
        </div>
    </main>

    <!-- MODAL NOVO/EDITAR INVESTIDOR -->
    <div class="modal" id="modalInvestidor">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">Novo Investidor</h2>
                <button class="close-btn" onclick="fecharModal()">&times;</button>
            </div>
            <form id="formInvestidor" onsubmit="salvarInvestidor(event)">
                <div class="form-row">
                    <div class="form-group">
                        <label for="nomeInvestidor">Nome Completo *</label>
                        <input type="text" id="nomeInvestidor" required>
                    </div>
                    <div class="form-group">
                        <label for="cpfInvestidor">CPF/CNPJ *</label>
                        <input type="text" id="cpfInvestidor" placeholder="000.000.000-00" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="emailInvestidor">E-mail *</label>
                        <input type="email" id="emailInvestidor" required>
                    </div>
                    <div class="form-group">
                        <label for="telefoneInvestidor">Telefone</label>
                        <input type="tel" id="telefoneInvestidor" placeholder="(11) 9999-9999">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="bancoInvestidor">Banco</label>
                        <select id="bancoInvestidor">
                            <option value="">-- Selecione --</option>
                            <option value="001">Banco do Brasil</option>
                            <option value="003">Caixa Econômica</option>
                            <option value="033">Santander</option>
                            <option value="341">Itaú</option>
                            <option value="389">Bradesco</option>
                            <option value="999">Outro</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="profissaoInvestidor">Profissão</label>
                        <input type="text" id="profissaoInvestidor" placeholder="Ex: Engenheiro">
                    </div>
                </div>

                <div class="form-group">
                    <label for="notasInvestidor">Observações</label>
                    <textarea id="notasInvestidor" rows="2" placeholder="Anotações sobre o investidor"></textarea>
                </div>

                <div class="button-group">
                    <button type="submit" class="btn-primary">💾 Salvar</button>
                    <button type="button" class="btn-secondary" onclick="fecharModal()">Cancelar</button>
                </div>
            </form>
        </div>
    </div>

    <!-- MODAL APORTE -->
    <div class="modal" id="modalAporte">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalAporteTitle">Novo Aporte</h2>
                <button class="close-btn" onclick="fecharModalAporte()">&times;</button>
            </div>
            <form id="formAporte" onsubmit="salvarAporte(event)">
                <div class="form-group">
                    <label for="tituloAporte">Título *</label>
                    <select id="tituloAporte" required onchange="atualizarInfoTitulo()">
                        <option value="">-- Selecione --</option>
                        <option value="IPCA2037">IPCA+ 2037</option>
                        <option value="IPCA2045">IPCA+ 2045</option>
                        <option value="IPCA2060">IPCA+ 2060</option>
                    </select>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="dataAporte">Data Aporte (dd/mm/aaaa) *</label>
                        <input type="text" id="dataAporte" placeholder="01/01/2025" maxlength="10" required>
                    </div>
                    <div class="form-group">
                        <label for="precoUnitario">Preço Unit. (R$) *</label>
                        <input type="number" id="precoUnitario" placeholder="1000.00" min="0" step="0.01" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="quantidade">Quantidade *</label>
                        <input type="number" id="quantidade" placeholder="10" min="1" step="1" required>
                    </div>
                    <div class="form-group">
                        <label for="taxaAporte">Taxa (% a.a.) *</label>
                        <input type="number" id="taxaAporte" placeholder="6.50" min="0" step="0.01" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="vnaInfo">VNA (R$)</label>
                    <input type="number" id="vnaInfo" placeholder="0.00" min="0" step="0.01" required>
                </div>

                <div class="form-group">
                    <label for="irInfo">IR Retido na Fonte (%)</label>
                    <input type="number" id="irInfo" value="15" min="0" max="100" step="0.01">
                </div>

                <div class="button-group">
                    <button type="submit" class="btn-primary">💰 Registrar</button>
                    <button type="button" class="btn-secondary" onclick="fecharModalAporte()">Cancelar</button>
                </div>
            </form>
        </div>
    </div>

    <footer>
        <p>&copy; 2025 Simulador IPCA+ CJS - Tesouro Direto</p>
        <p style="margin-top: 10px;">API tesouro.gov.br • Desenvolvido com ❤️</p>
    </footer>

    <script src="app.js"></script>
</body>
</html>
